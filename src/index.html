<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Over the Rainbow</title>
    <link rel="icon" type="image/x-icon" href="/assets/rainbow.txt">

    <style>
        :root {
            --powder-blush: #ffadad;
            --apricot-cream: #ffd6a5;
            --lemon-chiffon: #fdffb6;
            --tea-green: #caffbf;
            --soft-cyan: #9bf6ff;
            --baby-blue-ice: #a0c4ff;
            --periwinkle: #bdb2ff;
            --mauve: #ffc6ff;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game {
            display: block;
            width: 100vw;
            height: 100vh;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
    </div>
</body>
</html>
